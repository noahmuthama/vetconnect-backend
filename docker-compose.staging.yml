services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetconnect
      POSTGRES_USER: vetconnect
      POSTGRES_PASSWORD: change-me-in-local-staging
    ports:
      - "5432:5432"
    volumes:
      - vetconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetconnect -d vetconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg://vetconnect:change-me-in-local-staging@db:5432/vetconnect
      JWT_SECRET_KEY: replace-with-a-long-staging-secret
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      MAX_NEARBY_RADIUS_KM: 100
      RATE_LIMIT_PER_MINUTE: 60
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  vetconnect_pgdata:
